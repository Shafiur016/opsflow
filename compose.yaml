services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opsflow
    volumes: [opsflow_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://opsflow:${POSTGRES_PASSWORD}@db:5432/opsflow
      REDIS_URL: redis://redis:6379/0
      ENABLE_NOTIFICATIONS: '1'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  worker:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.notifications.celery_app", "worker", "--loglevel=info"]
    depends_on: [redis]
volumes:
  opsflow_pg:
